  - type: web
    name: trabajoya-gateway
    runtime: node
    plan: free
    rootDir: gateway
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: REGION_URL_CO
        sync: false
      - key: REGION_URL_US
        sync: false
      - key: REGION_URL_BR
        sync: false
      - key: REGION_URL_FR
        sync: false
      - key: REGION_URL_DE
        sync: false
      - key: AMQP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: trabajoya-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npx expo install react react-native react-native-web react-dom @expo/metro-runtime expo-image-picker @react-native-async-storage/async-storage react-native-screens react-native-safe-area-context expo-font @expo-google-fonts/plus-jakarta-sans && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EXPO_PUBLIC_GATEWAY_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
