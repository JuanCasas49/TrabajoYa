# Blueprint de Render: 5 APIs regionales (una por país, cada una con su base Neon) + gateway + web estática.
# Cada región es un servicio independiente: si una cae, las demás siguen funcionando.
services:
  - type: web
    name: trabajoya-api-co
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: REGION
        value: CO
      - key: DATABASE_URL          # base Neon propia de CO
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: AMQP_URL
        sync: false

  - type: web
    name: trabajoya-api-us
    runtime: node
    plan: free
    rootDir: backend
